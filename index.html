<script>

let guests = [];

Papa.parse("./please-find-your-seat.csv?v=1", {

    download: true,
    header: true,
    skipEmptyLines: true,

    complete: function(results){

        guests = results.data;

        console.log("Guests loaded:", guests.length);
        console.log(guests);

    },

    error: function(error){
        console.log("CSV Error:", error);
    }

});


const searchBox = document.getElementById("search");
const resultsDiv = document.getElementById("results");
const tableDiv = document.getElementById("tableNumber");


searchBox.addEventListener("input", function(){

    const search = this.value.trim().toLowerCase();

    resultsDiv.innerHTML = "";
    tableDiv.innerHTML = "";


    if(search === ""){
        return;
    }


    const matches = guests.filter(person => {

        const firstName = person["First Name"] || Object.values(person)[0] || "";

        return firstName
            .toString()
            .toLowerCase()
            .includes(search);

    });


    matches.slice(0,10).forEach(person => {


        const values = Object.values(person);

        const first = person["First Name"] || values[0];
        const last = person["Last Name"] || values[1];
        const table = person["Table"] || values[2];


        const div = document.createElement("div");

        div.className = "result";

        div.textContent = `${first} ${last}`;


        div.onclick = function(){


            searchBox.value = first;

            resultsDiv.innerHTML = "";


            tableDiv.innerHTML =
            `
            <span class="welcome">Welcome</span><br><br>
            <span class="luxury">${first}</span><br><br>
            <span class="luxury">Your Table is</span><br>
            <span class="luxury table-number">${table}</span>
            `;


        };


        resultsDiv.appendChild(div);


    });


});


</script>
