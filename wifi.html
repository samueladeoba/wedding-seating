<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Wi-Fi | Ayo & Dayo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f8f5ef;
            color: #222;
            padding: 20px;
        }

        .wifi-card {
            width: 100%;
            max-width: 420px;
            text-align: center;
            background: white;
            padding: 45px 30px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }

        .icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 30px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 35px;
        }

        .label {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #999;
            margin-bottom: 8px;
        }

        .wifi-name {
            font-size: 23px;
            font-weight: bold;
            margin-bottom: 30px;
            word-break: break-word;
        }

        .password {
            font-size: 23px;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 20px;
            min-height: 28px;
        }

        .button-row {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        button {
            flex: 1;
            padding: 14px 10px;
            border: none;
            border-radius: 12px;
            background: #222;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.98);
        }

        .secondary-button {
            background: #e8e5df;
            color: #222;
        }

        #message {
            margin-top: 15px;
            min-height: 20px;
            font-size: 14px;
            color: #777;
        }

        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #aaa;
        }

        @media (max-width: 400px) {
            .wifi-card {
                padding: 35px 20px;
            }

            .button-row {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="wifi-card">

        <div class="icon">📶</div>

        <h1>Wedding Wi-Fi</h1>

        <p class="subtitle">
            Stay connected and share the memories!
        </p>

        <div class="label">Wi-Fi Name</div>

        <div class="wifi-name">
            Kurisumasu_T&amp;S
        </div>

        <div class="label">Password</div>

        <div class="password" id="passwordDisplay">
            ***********
        </div>

        <div class="button-row">

            <button
                type="button"
                class="secondary-button"
                onclick="togglePassword()"
                id="toggleButton">
                👁 Show Password
            </button>

            <button
                type="button"
                onclick="copyPassword()">
                📋 Copy Password
            </button>

        </div>

        <div id="message"></div>

        <div class="footer">
            Ayo &amp; Dayo • 1 August 2026
        </div>

    </div>


    <script>

        const wifiPassword = "AyoTiDayo22";
        let passwordVisible = false;


        function togglePassword() {

            const passwordDisplay =
                document.getElementById("passwordDisplay");

            const toggleButton =
                document.getElementById("toggleButton");


            if (passwordVisible) {

                passwordDisplay.textContent = "***********";

                toggleButton.textContent = "👁 Show Password";

                passwordVisible = false;

            } else {

                passwordDisplay.textContent = wifiPassword;

                toggleButton.textContent = "🙈 Hide Password";

                passwordVisible = true;

            }

        }


        function copyPassword() {

            navigator.clipboard.writeText(wifiPassword)

                .then(() => {

                    document.getElementById("message").textContent =
                        "✓ Password copied to clipboard!";

                })

                .catch(() => {

                    document.getElementById("message").textContent =
                        "Please copy the password manually.";

                });

        }

    </script>

</body>
</html>
